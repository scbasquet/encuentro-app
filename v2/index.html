<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XXI Encuentro Nacional de Mini Básquet</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        pdfjsWorker = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </style>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .screen {
            display: none;
        }

        .screen.active {
            display: block;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .card h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }

        .card .subtitle {
            color: #666;
            font-size: 14px;
            margin-bottom: 30px;
        }

        .card .logo {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 0;
            width: 100%;
            font-weight: 600;
        }

        .btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .error-message {
            color: #d84315;
            font-size: 13px;
            margin-top: 10px;
        }

        .success-message {
            color: #2e7d32;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            padding: 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        .modal-content h2 {
            color: #667eea;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-buttons button {
            flex: 1;
        }

        /* Pantalla Principal */
        .main-screen {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
        }

        .main-screen h1 {
            color: #667eea;
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }

        .main-screen .subtitle {
            color: #999;
            font-size: 12px;
            text-align: center;
            margin-bottom: 30px;
        }

        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .menu-item {
            background: #f9f9f9;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .menu-item:hover {
            border-color: #667eea;
            background: #f5f5ff;
            transform: translateY(-4px);
        }

        .menu-item .icon {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .menu-item .label {
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        /* PDF Viewer */
        .pdf-container {
            background: #f5f5f5;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .pdf-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pdf-header .title {
            color: #333;
            font-weight: 600;
            font-size: 14px;
            flex: 1;
            word-break: break-word;
        }

        .pdf-controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .pdf-controls button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .pdf-controls button:hover {
            background: #5568d3;
        }

        .pdf-viewer {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 15px;
        }

        .pdf-page {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            min-height: 400px;
            background: #f9f9f9;
        }

        .pdf-page canvas {
            max-width: 100%;
            max-height: 600px;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
        }

        .pdf-nav {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: white;
            border-top: 1px solid #e0e0e0;
        }

        .pdf-nav button {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .pdf-nav button:hover {
            background: #5568d3;
        }

        .pdf-nav button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .pdf-page-info {
            color: #666;
            font-size: 13px;
            font-weight: 500;
        }

        .btn-back {
            background: #f0f0f0;
            color: #333;
            margin-top: 20px;
        }

        .file-list {
            background: #f9f9f9;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .empty-message {
            color: #999;
            font-size: 14px;
            text-align: center;
            padding: 20px;
        }

        .loading-spinner {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #667eea;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
            margin-right: 5px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .admin-secret-btn {
            position: fixed;
            bottom: 15px;
            right: 15px;
            width: 40px;
            height: 40px;
            background: rgba(102, 126, 234, 0.1);
            border: 1px solid rgba(102, 126, 234, 0.2);
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 100;
        }

        .admin-secret-btn:hover {
            background: rgba(102, 126, 234, 0.3);
            border-color: rgba(102, 126, 234, 0.4);
        }

        @media (max-width: 480px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Admin Modal (Escondido) -->
        <div id="adminModal" class="modal">
            <div class="modal-content">
                <h2>Administrador</h2>
                <form onsubmit="verifyAdminPassword(event)">
                    <div class="form-group">
                        <label for="adminPass">Contraseña</label>
                        <input type="password" id="adminPass" autofocus>
                    </div>
                    <div id="adminError" class="error-message"></div>
                    <div class="modal-buttons">
                        <button type="submit" class="btn">Entrar</button>
                        <button type="button" class="btn btn-secondary" onclick="closeAdminModal()">Cancelar</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Admin Panel -->
        <div id="adminPanel" class="screen card">
            <div class="logo">⚙️</div>
            <h1>Panel de Administración</h1>
            <p class="subtitle">Configuración de la App</p>
            
            <div class="form-group">
                <label for="adminScriptUrl">URL del Google Apps Script</label>
                <input type="text" id="adminScriptUrl" placeholder="https://script.google.com/macros/...">
                <div style="font-size: 12px; color: #999; margin-top: 8px;">Pega la URL completa del Deploy</div>
            </div>

            <button class="btn" onclick="saveAdminConfig()">💾 Guardar Configuración</button>
            <div id="adminSuccess" class="success-message">✅ Configuración guardada</div>
            
            <div style="margin-top: 30px; padding-top: 20px; border-top: 1px solid #e0e0e0;">
                <button class="btn btn-secondary" onclick="goToPublicApp()">👥 Ver App Pública</button>
                <button class="btn btn-secondary" onclick="logoutAdmin()" style="margin-top: 10px;">🚪 Cerrar Sesión</button>
            </div>
        </div>

        <!-- Public App - Main Menu -->
        <div id="publicMainScreen" class="screen active main-screen">
            <h1>XXI Encuentro Nacional</h1>
            <p class="subtitle">Mini Básquet</p>

            <div class="menu-grid">
                <div class="menu-item" onclick="openContent('show')">
                    <div class="icon">🎬</div>
                    <div class="label">Show</div>
                </div>
                <div class="menu-item" onclick="openContent('stands')">
                    <div class="icon">🏪</div>
                    <div class="label">Stands</div>
                </div>
                <div class="menu-item" onclick="openContent('fixture')">
                    <div class="icon">📋</div>
                    <div class="label">Fixture</div>
                </div>
                <div class="menu-item" onclick="openContent('plano')">
                    <div class="icon">🗺️</div>
                    <div class="label">Plano & Canchas</div>
                </div>
                <div class="menu-item" onclick="openContent('sponsors')">
                    <div class="icon">🤝</div>
                    <div class="label">Sponsors</div>
                </div>
            </div>
        </div>

        <!-- Public App - Content -->
        <div id="publicContentScreen" class="screen main-screen">
            <h1 id="contentTitle">Contenido</h1>
            <p class="subtitle" id="contentSubtitle"></p>

            <div class="file-list" id="fileList"></div>

            <button class="btn btn-back" onclick="goBackToMenu()">← Volver</button>
        </div>
    </div>

    <!-- Botón Admin Secreto -->
    <button class="admin-secret-btn" onclick="openAdminModal()" title="🔐">⚙️</button>

    <script>
        const ADMIN_PASSWORD = 'admin123'; // Cambiar esto
        const SCRIPT_URL_KEY = 'encuentro_scriptUrl';

        let appState = {
            isAdmin: false,
            scriptUrl: null,
            currentContentType: ''
        };

        const contentConfig = {
            show: { title: '🎬 Show', subtitle: 'Videos y contenido del show' },
            stands: { title: '🏪 Stands', subtitle: 'Información de stands' },
            fixture: { title: '📋 Fixture', subtitle: 'Horarios y resultados' },
            plano: { title: '🗺️ Plano & Canchas', subtitle: 'Mapa del encuentro' },
            sponsors: { title: '🤝 Sponsors', subtitle: 'Empresas patrocinadoras' }
        };

        let pdfState = {};

        // === ADMIN FUNCTIONS ===
        function openAdminModal() {
            document.getElementById('adminError').textContent = '';
            document.getElementById('adminPass').value = '';
            document.getElementById('adminModal').classList.add('active');
        }

        function closeAdminModal() {
            document.getElementById('adminModal').classList.remove('active');
            document.getElementById('adminError').textContent = '';
        }

        function verifyAdminPassword(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPass').value;
            
            if (pass === ADMIN_PASSWORD) {
                appState.isAdmin = true;
                const saved = localStorage.getItem(SCRIPT_URL_KEY);
                if (saved) {
                    document.getElementById('adminScriptUrl').value = saved;
                    appState.scriptUrl = saved;
                }
                closeAdminModal();
                showScreen('adminPanel');
            } else {
                document.getElementById('adminError').textContent = 'Contraseña incorrecta';
            }
        }

        function saveAdminConfig() {
            const url = document.getElementById('adminScriptUrl').value.trim();
            
            if (!url || !url.includes('script.google.com')) {
                alert('URL no válida');
                return;
            }
            
            appState.scriptUrl = url;
            localStorage.setItem(SCRIPT_URL_KEY, url);
            
            document.getElementById('adminSuccess').style.display = 'block';
            setTimeout(() => {
                document.getElementById('adminSuccess').style.display = 'none';
            }, 3000);
        }

        function logoutAdmin() {
            appState.isAdmin = false;
            document.getElementById('adminScriptUrl').value = '';
            showScreen('publicMainScreen');
        }

        function goToPublicApp() {
            showScreen('publicMainScreen');
        }

        // === PUBLIC APP FUNCTIONS ===
        function openContent(type) {
            const config = contentConfig[type];
            document.getElementById('contentTitle').textContent = config.title;
            document.getElementById('contentSubtitle').textContent = config.subtitle;
            
            appState.currentContentType = type;
            loadFiles(type);
            
            showScreen('publicContentScreen');
        }

        function goBackToMenu() {
            showScreen('publicMainScreen');
        }

        function loadFiles(type) {
            const fileList = document.getElementById('fileList');
            fileList.innerHTML = '<div class="empty-message"><span class="loading-spinner"></span>Cargando...</div>';
            
            fetch(`${appState.scriptUrl}?action=getFiles&section=${type}`)
            .then(r => r.json())
            .then(data => {
                if (data.success && data.files.length > 0) {
                    let html = '';
                    const pdfFiles = data.files.filter(f => f.fileName.match(/\.pdf$/i));
                    
                    pdfFiles.forEach((file, idx) => {
                        html += `
                            <div class="pdf-container">
                                <div class="pdf-header">
                                    <div class="title">📄 ${file.fileName}</div>
                                    <div class="pdf-controls">
                                        <a href="${file.fileLink}" target="_blank" style="text-decoration: none;">
                                            <button>↓ Descargar</button>
                                        </a>
                                    </div>
                                </div>
                                <div class="pdf-viewer">
                                    <div class="pdf-page" id="pdf-page-${idx}">
                                        <div style="color: #999; text-align: center;">
                                            <div class="loading-spinner"></div>
                                            Cargando PDF...
                                        </div>
                                    </div>
                                    <div class="pdf-nav" id="pdf-nav-${idx}" style="display: none;">
                                        <button onclick="previousPdfPage(${idx})" id="pdf-prev-${idx}">← Anterior</button>
                                        <span class="pdf-page-info">
                                            Página <span id="pdf-current-${idx}">1</span> de <span id="pdf-total-${idx}">0</span>
                                        </span>
                                        <button onclick="nextPdfPage(${idx})" id="pdf-next-${idx}">Siguiente →</button>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    
                    fileList.innerHTML = html;
                    
                    pdfFiles.forEach((file, idx) => {
                        renderPdfPreview(file.fileLink, idx);
                    });
                } else {
                    fileList.innerHTML = '<div class="empty-message">No hay archivos disponibles</div>';
                }
            })
            .catch(err => {
                fileList.innerHTML = '<div class="empty-message">Error al cargar contenido</div>';
            });
        }

        function extractFileId(url) {
            if (!url) return null;
            
            // Formato: /file/d/ID
            let match = url.match(/\/file\/d\/([a-zA-Z0-9-_]+)/);
            if (match) return match[1];
            
            // Formato: d=ID
            match = url.match(/[?&]d=([a-zA-Z0-9-_]+)/);
            if (match) return match[1];
            
            // Formato: /d/ID/
            match = url.match(/\/d\/([a-zA-Z0-9-_]+)/);
            if (match) return match[1];
            
            // Formato: id=ID
            match = url.match(/[?&]id=([a-zA-Z0-9-_]+)/);
            if (match) return match[1];
            
            return null;
        }

        function renderPdfPreview(fileLink, pageIdx) {
            const fileId = extractFileId(fileLink);
            
            if (!fileId) {
                showPdfError(pageIdx, fileLink, 'No se pudo extraer el ID del archivo');
                return;
            }
            
            // Intentar con URL de exportación directa
            const pdfUrl = `https://drive.google.com/uc?export=pdf&id=${fileId}`;
            
            pdfjsLib.getDocument({
                url: pdfUrl,
                withCredentials: false
            }).promise.then(pdf => {
                pdfState[pageIdx] = { pdf, currentPage: 1 };
                renderPdfPage(pageIdx, 1);
                
                if (pdf.numPages > 1) {
                    document.getElementById(`pdf-nav-${pageIdx}`).style.display = 'flex';
                    document.getElementById(`pdf-total-${pageIdx}`).textContent = pdf.numPages;
                }
            }).catch(err => {
                console.error('Error cargando PDF:', err);
                // Fallback: Mostrar iframe de Google Drive Viewer
                const pageDiv = document.getElementById(`pdf-page-${pageIdx}`);
                if (pageDiv) {
                    pageDiv.innerHTML = `<iframe src="https://drive.google.com/file/d/${fileId}/preview" width="100%" height="500" frameborder="0" allowfullscreen=""></iframe>`;
                }
            });
        }

        function showPdfError(pageIdx, fileLink, message) {
            const pageDiv = document.getElementById(`pdf-page-${pageIdx}`);
            if (pageDiv) {
                pageDiv.innerHTML = `<div style="color: #d84315; padding: 20px; text-align: center;">
                    <p>${message}</p>
                    <a href="${fileLink}" target="_blank" style="color: #667eea; font-weight: 600; display: inline-block; margin-top: 10px;">Ver en Google Drive →</a>
                </div>`;
            }
        }

        function renderPdfPage(pageIdx, pageNum) {
            const state = pdfState[pageIdx];
            if (!state) return;
            
            state.pdf.getPage(pageNum).then(page => {
                const canvas = document.createElement('canvas');
                const context = canvas.getContext('2d');
                const viewport = page.getViewport({ scale: 1.5 });
                
                canvas.width = viewport.width;
                canvas.height = viewport.height;
                
                page.render({ canvasContext: context, viewport }).promise.then(() => {
                    const pageDiv = document.getElementById(`pdf-page-${pageIdx}`);
                    if (pageDiv) {
                        pageDiv.innerHTML = '';
                        pageDiv.appendChild(canvas);
                    }
                    
                    state.currentPage = pageNum;
                    document.getElementById(`pdf-current-${pageIdx}`).textContent = pageNum;
                    document.getElementById(`pdf-prev-${pageIdx}`).disabled = pageNum === 1;
                    document.getElementById(`pdf-next-${pageIdx}`).disabled = pageNum === state.pdf.numPages;
                });
            });
        }

        function nextPdfPage(pageIdx) {
            const state = pdfState[pageIdx];
            if (state && state.currentPage < state.pdf.numPages) {
                renderPdfPage(pageIdx, state.currentPage + 1);
            }
        }

        function previousPdfPage(pageIdx) {
            const state = pdfState[pageIdx];
            if (state && state.currentPage > 1) {
                renderPdfPage(pageIdx, state.currentPage - 1);
            }
        }

        // === UTILITIES ===
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        // Inicializar
        window.addEventListener('load', () => {
            const saved = localStorage.getItem(SCRIPT_URL_KEY);
            if (saved) {
                appState.scriptUrl = saved;
            }
        });
    </script>
</body>
</html>
